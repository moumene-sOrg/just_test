<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueAdmin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-gray-800 antialiased">

    <!-- LOGIN PAGE -->
    <div id="login-page" class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="flex items-center justify-between mb-8 md:mb-12">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white">
                        <i data-lucide="paw-print" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xl font-bold text-gray-900">RescuePaw Admin</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-8 md:p-10">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white mx-auto mb-4 shadow-lg shadow-blue-200">
                        <i data-lucide="paw-print" class="w-8 h-8"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back</h1>
                    <p class="text-gray-500 text-sm">Enter your credentials to manage the rescue</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-3 w-5 h-5 text-gray-400"></i>
                            <input type="text" id="admin-user" placeholder="Enter your username" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none transition" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-gray-400"></i>
                            <input type="password" id="admin-pass" placeholder="Enter your password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none transition" required>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-600">
                            <span class="text-gray-600">Remember me</span>
                        </label>
                        <a href="#" class="text-blue-600 font-medium hover:underline">Forgot password?</a>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition transform">
                        Login to Admin Panel
                    </button>
                    <p id="admin-error" class="text-red-500 text-xs text-center mt-2"></p>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-xs text-gray-400 uppercase tracking-wider mb-4">Secure Admin Access Only</p>
                    <div class="flex justify-center gap-6 text-xs text-gray-500">
                        <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-4 h-4"></i> 256-bit Encryption</span>
                        <span class="flex items-center gap-1"><i data-lucide="clock" class="w-4 h-4"></i> Session Logging</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin_app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
