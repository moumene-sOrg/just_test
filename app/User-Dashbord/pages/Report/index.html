<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../src/css/style.css" />
    <!-- Box icons -->
    <!-- Basic Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- Filled Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css"
      rel="stylesheet"
    />
    <!-- Brand Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <title>Report Animal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              'main-blue': '#197FE6',
              'week-gray': '#F1F5F9',
              'icons': '#94A3B8',
              'grey-text': '#475569',
              primary: "#197fe6",
              "background-light": "#f6f7f8",
              "background-dark": "#111921",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              "3xl": "1.5rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-slate-950 font-display text-slate-900 dark:text-slate-100">
    <div class="flex h-screen overflow-hidden">
        <aside
          class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 md:flex flex-col justify-between py-6 px-4 z-10 hidden h-full sticky top-0"
        >
        <div class="flex flex-col gap-8">
          <!-- Logo -->
          <div class="flex items-center gap-3 px-2">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-sm">
              <img src="../../public/Logo.svg" alt="Logo" class="w-7 h-7 " />
            </div>
            <div>
              <p class="text-sm font-black text-slate-900 leading-tight">Mission Control</p>
              <p class="text-xs font-semibold text-main-blue leading-tight">Reporter Portal</p>
            </div>
          </div>
          <ul class="w-full flex flex-col justify-center items-start gap-1 px-2">
            <li class="w-full rounded-xl">
              <a href="../../index.html">
                <div class="flex flex-row items-center gap-1.5 w-full p-2 rounded-xl">
                  <i class="fa-solid fa-house text-2xl text-icons"></i>
                  <span class="text-icons text-sm font-medium mt-0.5">Home</span>
                </div>
              </a>
            </li>
            <li class="w-full rounded-xl">
              <a href="../MyReports/index.html">
                <div class="flex flex-row items-center gap-1.5 w-full p-2 rounded-xl">
                  <i class="fa-regular fa-file-lines text-2xl text-icons"></i>
                  <span class="text-icons text-sm font-medium mt-0.5">My Reports</span>
                </div>
              </a>
            </li>
            <li class="w-full rounded-xl active-page-aside">
              <a href="../Report/index.html">
                <div class="flex flex-row items-center gap-1.5 w-full p-2 rounded-xl">
                  <i class="bx bx-announcement text-3xl text-icons active-link"></i>
                  <span class="text-icons text-sm font-medium active-link">Report Animal</span>
                </div>
              </a>
            </li>
            <li class="w-full rounded-xl">
              <a href="../Chat/index.html">
                <div class="flex flex-row items-center gap-1.5 w-full p-2 rounded-xl">
                  <i class="bx bx-discussion text-[27px] text-icons"></i>
                  <span class="text-icons text-sm font-medium">Messages</span>
                </div>
              </a>
            </li>
            <li class="w-full rounded-xl">
              <a href="../profile/index.html">
                <div class="flex flex-row items-center gap-1.5 w-full p-2 rounded-xl">
                  <i class="fa-regular fa-user text-2xl text-icons"></i>
                  <span class="text-icons text-sm font-medium mt-0.5">profile</span>
                </div>
              </a>
            </li>
          </ul>
        </div>
        </aside>

        <!-- column 2 -->
        <main
          class="col2 flex-1 overflow-y-auto mb-5 md:p-6 w-full"
        >
        <header
          class="flex flex-row justify-center items-center w-full bg-white  md:hidden p-4 "
        >
              <a href="../../index.html"><i class="fa-solid text-xl fa-chevron-left justify-self-start"></i></a></i>
              <h2 class="font-bold text-xl m-auto">Report Animal</h2>
        </header>
        <div class="form p-4 flex flex-col gap-6   md:rounded-2xl md:w-9/10 md:p-4 md:px-6 md:shadow-2xl ">
            <form action="" class=" ">
                <div class="anima-detail flex flex-col gap-4 md:grid md:grid-cols-2 ">
                    <h2 class="text-xl font-bold md:col-start-2">Animals Details</h2>
                <div class="animal-type flex flex-col md:col-start-2 ">
                    <label for="animal-type-select" class="text-gray-600 text-sm font-medium ml-1 mb-1">Animal Type</label>
                    <div class="select-box relative" id="animal-type-select" >
                        <div class="result border border-gray-200 p-2 px-4 rounded-xl flex justify-between items-center">Select animal Type<i class="fa-solid fa-chevron-down "></i></div>
                        <div class="options bg-gray-300 rounded-xl mt-1 *:p-2 absolute w-full hidden z-3">
                            <div class="option hover:bg-main-blue/15 rounded-t-xl cursor-pointer">
                                <div class="transition-all duration-200 hover:translate-x-1.5">dog</div>
                            </div>
                            <div class="option hover:bg-main-blue/15 cursor-pointer">
                                <div class="transition-all duration-200 hover:translate-x-1.5">cat</div>
                            </div>
                            <div class="option hover:bg-main-blue/15 cursor-pointer">
                                <div class="transition-all duration-200 hover:translate-x-1.5">bird</div>
                            </div>
                            <div class="option hover:bg-main-blue/15 cursor-pointer">
                                <div class="transition-all duration-200 hover:translate-x-1.5">cow</div>
                            </div>
                            <div class="option hover:bg-main-blue/15 cursor-pointer">
                                <div class="transition-all duration-200 hover:translate-x-1.5">sheep</div>
                            </div>
                            <div class="option hover:bg-main-blue/15 rounded-b-xl cursor-pointer">
                                <div class="transition-all duration-200 hover:translate-x-1.5">other</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="animal-status flex flex-col md:col-start-2 ">
                    <label for="animal-status" class="text-gray-600 text-sm font-medium ml-1 mb-1">Animal Status</label>
                    <input type="text" id="animal-status" name="animal-status" placeholder="e.g. Injured, Stray, Healthy" class="border border-gray-200 px-4 py-3 rounded-xl focus:outline-none focus:border-main-blue w-full shadow-sm">
                </div>

                <div class="photo-evident flex flex-col gap-4 md:col-start-1 md:row-start-1 md:row-span-3 ">
                    <h2 class="text-xl font-bold">Photo Evident</h2>
                <div class="verification-img flex flex-col">
                <label for="facility-img" id="drop-area" class="flex flex-col border-2 border-dashed border-gray-300 rounded-2xl justify-center items-center  text-center overflow-hidden">
                  <input
                    type="file"
                    name="facility-img"
                    hidden
                    id="facility-img"
                    accept="image/*"
                  />
                  <div id="img-view" class="flex flex-col justify-center items-center gap-2 h-50 w-full p-10 bg-center bg-cover bg-no-repeat ">
                    <img src="../../public/Mobile/camera.svg" alt="camera"  />
                    <h4 class="font-medium">Upload or take photo</h4>
                    <p class="text-sm font-medium text-icons ">PNG, oPG or oPEG (Max. 10MB)</p>
                  </div>
                </label>
              </div>
                </div>
                <div class="location flex flex-col gap-4 md:col-start-2">
                    <div class="location-head flex justify-between items-center">
                        <label for="location" class="text-xl font-bold">Location</label>
                    </div>
                    <div class="location-box flex flex-col gap-2">
                        <input type="text" id="location" name="location" placeholder="Enter location (e.g. Market St & 5th St)" class="border border-gray-200 px-4 py-3 rounded-xl focus:outline-none focus:border-main-blue w-full shadow-sm">
                    </div>
                </div>
                <div class="date-time flex flex-col gap-6  md:col-start-1 md:row-start-4">
                    <div class="Time flex flex-col gap-4 md:col-start-1 md:row-start-4 ">
                    <h2 class="text-xl font-bold">Date & Time</h2>
                    <div class="flex justify-between gap-4">
                        <div class="flex flex-col w-1/2" >
                            <label for="date" class="text-sm font-semibold text-gray-600 mb-1.5 ml-1">Date</label>
                            <input type="date" name="date" id="date" class="border border-gray-200 px-4 py-3 rounded-xl  ">
                        </div>
                        <div class="flex flex-col w-1/2">
                            <label for="time"  class="text-sm font-semibold text-gray-600 mb-1.5 ml-1">Time</label>
                            <input type="time" name="time" id="time"  class="border border-gray-200 px-4 py-3 rounded-xl ">
                        </div>
                    </div>
                </div>

                <div class="aditional-details flex flex-col gap-4 md:col-start-1 md:row-start-4 ">
                    <h2 class="text-xl font-bold">Aditional Details</h2>
                    <textarea id="additional-details" placeholder="Describe markings, behavior, or specific location details..." class="w-full resize-none border border-gray-200 p-3 rounded-xl shadow placeholder:text-[#94A3B8] min-h-25 focus:outline-none"></textarea>
                </div>

            </div>
            <div class="btns flex gap-4 md:justify-end md:col-start-2 mt-4">
                <button type="button" id="sb-report" class="bg-[#197fe6] px-6 py-2 rounded-xl text-white font-bold cursor-pointer hover:bg-blue-600 transition-colors w-full md:w-auto shadow-md shadow-[#197fe6]/30">Submit Report</button>
            </div>
                </div>

            </form>

        </div>
        </main>
    <nav
      class="flex fixed bottom-2 justify-between items-center left-4 right-4 bg-white p-4 rounded-3xl shadow-2xl md:hidden z-50"
    >
      <a href="../../index.html">
        <div class="flex flex-col items-center">
          <i class="fa-solid fa-house text-2xl text-icons"></i>
          <span class="text-icons text-xs font-medium mt-0.5">Home</span>
        </div>
      </a>
      <a href="../MyReports/index.html">
        <div class="flex flex-col justify-center items-center">
          <i class="fa-regular fa-file-lines text-2xl text-icons"></i>
          <span class="text-icons text-xs font-medium mt-0.5"
            >My Reports</span
          >
        </div>
      </a>
      <a href="../Report/index.html">
        <div class="flex flex-col items-center">
          <div
            class="p-0.5 bg-linear-to-r from-main-blue via-[#60A5FA] to-[#34D399] rounded-full"
          >
            <div
              class="circle p-1 rounded-full w-9 h-9 flex justify-center items-center bg-main-blue border-lime-200"
            >
              <i class="fa-solid fa-plus text-white"></i>
            </div>
          </div>
        </div>
      </a>
      <a href="../Chat/index.html">
        <div class="flex flex-col justify-center items-center">
          <i class="bx bx-discussion text-2xl text-icons"></i>
          <span class="text-icons text-xs font-medium">Messages</span>
        </div>
      </a>
      <a href="../profile/index.html">
        <div class="flex flex-col justify-center items-center">
          <i class="fa-regular fa-user text-2xl text-icons"></i>
          <span class="text-icons text-xs font-medium mt-0.5">profile</span>
        </div>
      </a>
    </nav>
    <script type="module" src="../../src/js/shared/main.js"></script>
    <script type="module" src="../../src/js/pages/report.js"></script>
  </body>
  <script>
    const BASE = "http://localhost:3000";
  </script>
</html>
