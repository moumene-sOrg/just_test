<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refuge Sign Up - Operational Info</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="fontawesome/all.css">
  <link rel="stylesheet" href="refuge+vet.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
<div class="max-w-2xl w-full glass rounded-3xl shadow-2xl overflow-hidden border border-white">
  <section id="refuge-sign" class="p-8 space-y-6">
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-bold text-slate-900">Refuge Details</h2>
      <p class="text-slate-500">Operational and capacity information</p>
    </div>
    <form id="refugeForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-4">
        <div>
          <label for="refuge-name" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Representative Name</label>
          <input type="text" id="refuge-name" placeholder="Full name" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
        </div>
        <div>
          <label for="refuge-address" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Refuge Address</label>
          <input type="text" id="refuge-address" placeholder="Street, Building, City" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="registration-id" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Registration ID</label>
            <input type="number" id="registration-id" placeholder="123456" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
          </div>
          <div>
            <label for="max-capacity" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Max Capacity</label>
            <input type="number" id="max-capacity" placeholder="50" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
          </div>
        </div>
        <div>
          <label for="current-animals" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Current Animals</label>
          <input type="number" id="current-animals" placeholder="0" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
        </div>
      </div>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="opening-from" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Opening From</label>
            <input type="time" id="opening-from" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
          </div>
          <div>
            <label for="opening-till" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Opening Till</label>
            <input type="time" id="opening-till" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
          </div>
        </div>
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-slate-700 ml-1">Facility Photo</label>
          <label for="facility-img" id="drop-area" class="flex flex-col border-2 border-dashed border-slate-300 rounded-2xl justify-center items-center text-center overflow-hidden cursor-pointer hover:border-primary hover:bg-primary/5 transition-all h-48">
            <input type="file" id="facility-img" accept="image/*" hidden>
            <div id="img-view" class="flex flex-col justify-center items-center gap-2 w-full h-full p-4 bg-center bg-cover bg-no-repeat">
              <i class="fa-solid fa-image text-3xl text-slate-300"></i>
              <h4 class="font-medium text-slate-600">Upload facility photo</h4>
              <p class="text-xs text-slate-400">PNG, JPG (Max. 10MB)</p>
            </div>
          </label>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-[#197FE6] text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/30 hover:bg-blue-600 transition-all transform active:scale-[0.98] mt-2">
          Complete Registration
        </button>
      </div>
    </form>
    <div class="text-center pt-2">
      <a href="ChoosingTypePage.html" class="text-sm font-medium text-slate-500 hover:text-primary transition-colors inline-flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i>
        Back to role selection
      </a>
    </div>
  </section>
</div>
<script src="vet+refuge.js"></script>
</body>
</html>
