<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SingnInAndChoosingTypesStyles.css">
</head>

<body class="login-calss">
    <div class="page-desktop">
        <div class="image-half">
            <img src="Images/dog.jpg" alt="animal">
            <div class="image-logo">
                <img src="Images/logo.png" alt="logo">
                <span>AdoptMe</span>
            </div>
            <div class="image-text">
                <h1>Secure your account.</h1>
                <span>Create a strong password to keep your profile and your pets safe.</span>
            </div>
        </div>

        <div class="content-half">
            <section class="logo-section">
                <img src="Images/logo.png" alt="AdopteMe" class="logo">
                <h1>Reset Password</h1>
                <div class="text">Choose a new password for your account.</div>
            </section>

            <section class="input-section">
                <div class="label">New Password</div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input id="new-password" type="password" placeholder="New Password" required>
                </div>
            </section>

            <section class="input-section">
                <div class="label">Confirm Password</div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input id="confirm-password" type="password" placeholder="Confirm Password" required>
                </div>
            </section>

            <section class="errormessage">
                <span id="message" style="color: green;"></span>
                <span id="error-message" style="color: red;"></span>
            </section>

            <section class="login-button">
                <button id="reset-btn">Update Password</button>
            </section>
        </div>
    </div>

    <script>
        document.getElementById('reset-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const message = document.getElementById('message');
            const errorMsg = document.getElementById('error-message');

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            message.textContent = '';
            errorMsg.textContent = '';

            if (!password || !confirm) {
                errorMsg.textContent = 'Please fill in all fields';
                return;
            }

            if (password !== confirm) {
                errorMsg.textContent = 'Passwords do not match';
                return;
            }

            if (!token) {
                errorMsg.textContent = 'Invalid or missing reset token';
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/app/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = 'Password updated successfully! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = 'SignInPage.html';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.message || 'Error resetting password';
                }
            } catch (error) {
                console.error("RESET PASSWORD ERROR:", error);
                errorMsg.textContent = 'Server error. Please try again.';
            }
        });
    </script>
</body>

</html>
