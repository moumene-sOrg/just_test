<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SingnInAndChoosingTypesStyles.css">
</head>

<body class="login-calss">
    <div class="page-desktop">
        <div class="image-half">
            <img src="Images/dog.jpg" alt="animal">
            <div class="image-logo">
                <img src="Images/logo.png" alt="logo">
                <span>AdoptMe</span>
            </div>
            <div class="image-text">
                <h1>Don't worry, we've got you covered.</h1>
                <span>Enter your email address and we'll send you a link to reset your password.</span>
            </div>
        </div>

        <div class="content-half">
            <section class="logo-section">
                <img src="Images/logo.png" alt="AdopteMe" class="logo">
                <h1>Forgot Password?</h1>
                <div class="text">No problem! Enter your email below.</div>
            </section>

            <section class="input-section">
                <div class="label">Email Address</div>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input id="forgot-email" type="email" placeholder="e.g. alex@example.com" required>
                </div>
            </section>

            <section class="errormessage">
                <span id="message" style="color: green;"></span>
                <span id="error-message" style="color: red;"></span>
            </section>

            <section class="login-button">
                <button id="reset-request-btn">Send Reset Link</button>
            </section>

            <section class="footer">
                <span>Remember your password?
                    <a href="SignInPage.html">Login</a>
                </span>
            </section>
        </div>
    </div>

    <script>
        document.getElementById('reset-request-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            const message = document.getElementById('message');
            const errorMsg = document.getElementById('error-message');

            message.textContent = '';
            errorMsg.textContent = '';

            if (!email) {
                errorMsg.textContent = 'Please enter your email';
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/app/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = 'Reset link has been generated. Since this is a demo, please check the console or use the link below.';
                    // For demo purposes, we might show the link if the server returns it
                    if(data.resetLink) {
                        const linkEl = document.createElement('a');
                        linkEl.href = data.resetLink;
                        linkEl.textContent = 'Click here to reset (Demo mode)';
                        linkEl.style.display = 'block';
                        linkEl.style.marginTop = '10px';
                        linkEl.style.color = '#2563EB';
                        message.appendChild(document.createElement('br'));
                        message.appendChild(linkEl);
                    }
                } else {
                    errorMsg.textContent = data.message || 'Error sending reset link';
                }
            } catch (error) {
                console.error("FORGOT PASSWORD ERROR:", error);
                errorMsg.textContent = 'Server error. Please try again.';
            }
        });
    </script>
</body>

</html>
